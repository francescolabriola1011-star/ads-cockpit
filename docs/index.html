<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ADS Cockpit</title>
<style>
:root{
  --surface:#1a1a19; --plane:#0d0d0d; --card:#212120; --line:#33322f;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --accent:#d4af37;
}
@media (prefers-color-scheme: light){
  :root{ --surface:#fcfcfb; --plane:#f9f9f7; --card:#ffffff; --line:#e4e3df;
         --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --accent:#8a6d0b; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
a{color:var(--accent)}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
   margin:38px 0 12px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin:0}
.mono{font-variant-numeric:tabular-nums}

/* regole */
.rules{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.rule{background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;font-size:12.5px;color:var(--ink2)}
.rule b{color:var(--ink)}

/* stat tiles */
.tiles{display:grid;gap:12px;margin-top:14px;
  grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile .val{font-size:27px;font-weight:650;margin-top:5px;letter-spacing:-.02em}
.tile .note{font-size:12px;color:var(--muted);margin-top:3px}
.tile.hero{border-color:var(--crit)}
.tile.hero .val{color:var(--crit)}
.tile.act{border-color:var(--warn)}
.tile.act .val{color:var(--warn)}

/* azioni */
.act-row{display:grid;grid-template-columns:22px 88px 1fr auto;gap:14px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--crit);
  border-radius:10px;padding:12px 16px;margin-bottom:8px}
.act-row .who{font-weight:650;font-size:13px;color:var(--accent)}
.act-row .what{font-size:14px}
.act-row .why{font-size:12.5px;color:var(--muted);margin-top:2px}
.pos{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-size:12px}
.pos .pl{color:var(--muted);margin-right:2px}
.pos span.p{border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.pos span.p.kill{border-color:var(--crit);color:var(--crit);font-weight:600}
.act-row .tick input{width:18px;height:18px;cursor:pointer;accent-color:var(--good)}
.act-row.done{opacity:.5;border-left-color:var(--good)}
.act-row.done .what{text-decoration:line-through}
.act-row .burn{text-align:right;font-size:13px;color:var(--crit);font-weight:600;white-space:nowrap}

/* chip stato */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;
  padding:3px 8px;border-radius:6px;white-space:nowrap;border:1px solid}
.chip .dot{width:7px;height:7px;border-radius:50%}
.c-kill{color:var(--crit);border-color:var(--crit)} .c-kill .dot{background:var(--crit)}
.c-watch{color:var(--warn);border-color:var(--warn)} .c-watch .dot{background:var(--warn)}
.c-winner{color:var(--good);border-color:var(--good)} .c-winner .dot{background:var(--good)}
.c-ok{color:var(--ink2);border-color:var(--line)} .c-ok .dot{background:var(--ink2)}
.c-early{color:var(--muted);border-color:var(--line)} .c-early .dot{background:var(--muted)}

/* clienti */
.client{background:var(--card);border:1px solid var(--line);border-radius:12px;
  margin-bottom:10px;overflow:hidden}
.chead{display:grid;grid-template-columns:110px repeat(5,minmax(66px,1fr)) 150px 24px;
  gap:12px;align-items:center;padding:14px 16px;cursor:pointer;user-select:none}
.chead:hover{background:rgba(212,175,55,.05)}
.chead .alias{font-weight:700;color:var(--accent);letter-spacing:.02em}
.k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.v{font-size:16px;font-weight:600;margin-top:2px}
.bar{height:7px;border-radius:4px;background:rgba(137,135,129,.22);overflow:hidden;margin-top:7px}
.bar > i{display:block;height:100%;border-radius:4px;background:var(--crit)}
.caret{color:var(--muted);transition:transform .15s}
.client.open .caret{transform:rotate(90deg)}
.cbody{display:none;border-top:1px solid var(--line);padding:4px 0 8px}
.client.open .cbody{display:block}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
   text-align:right;padding:10px 12px;font-weight:600;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
tr:last-child td{border-bottom:none}
.cname{max-width:340px}
.cname .n{font-weight:550}
.cname .r{font-size:12px;color:var(--muted);margin-top:2px}
.flag{font-size:12px;color:var(--serious);margin-top:3px}
.off{opacity:.5}
tr.camp td{background:rgba(127,127,127,.07)}
tr.ad .cname .n{font-weight:450;padding-left:10px}
.flag.riprova{background:#fff4d6;border-left:3px solid #e0a800;color:#7a5600;font-weight:600;padding-left:6px}
.tag-off{font-size:10.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;margin-left:6px}
.up{color:var(--crit)} .down{color:var(--good)}

/* filtri */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 0}
select,button.tgl{background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
button.tgl[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--muted);padding:18px;text-align:center;font-size:13.5px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.fermi{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.fermo{background:var(--card);border:1px dashed var(--line);border-radius:8px;
  padding:7px 12px;font-size:13px;color:var(--ink2)}
.fermo b{color:var(--accent)}
.nuovo{background:var(--card);border:1px solid var(--good);border-left:3px solid var(--good);
  border-radius:10px;padding:11px 16px;margin-top:14px;font-size:13.5px}
.nuovo b{color:var(--good)}
footer{margin-top:44px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:820px){
  .chead{grid-template-columns:1fr 1fr;gap:10px}
  .chead .spark{grid-column:1/-1}
  .act-row{grid-template-columns:1fr;gap:6px}
  .act-row .burn{text-align:left}
  table{font-size:12.5px} td,th{padding:8px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1 id="titolo">ADS Cockpit</h1>
      <p class="sub" id="meta">caricamento…</p>
    </div>
    <button class="tgl" id="unlock">Mostra nomi veri</button>
  </div>
  <div class="rules" id="rules"></div>
  <div id="nuovi"></div>

  <div class="filters" id="scopebar">
    <select id="fCliente"><option value="">Tutti i clienti</option></select>
    <span class="sub" id="scopeNote"></span>
  </div>

  <h2 id="h-quadro">Il quadro</h2>
  <div class="tiles" id="tiles"></div>

  <h2>Azioni di oggi <span id="nact" style="color:var(--crit)"></span></h2>
  <div id="azioni"></div>

  <h2>Appuntamenti fatti</h2>
  <div id="esiti"></div>

  <h2>Clienti arrivati</h2>
  <div id="chiusi"></div>

  <h2>Dove riallocare</h2>
  <div id="realloc"></div>

  <h2>Clienti <span id="ntitle" style="color:var(--muted);font-weight:400"></span></h2>
  <div class="filters">
    <select id="fStato">
      <option value="">Tutti gli stati</option>
      <option value="kill">Solo da staccare</option>
      <option value="watch">Solo sorvegliate</option>
      <option value="winner">Solo vincenti</option>
    </select>
    <button class="tgl" id="fAttive" aria-pressed="false">Solo creative ancora accese</button>
    <button class="tgl" id="fExp" aria-pressed="false">Apri tutti i clienti</button>
  </div>
  <div id="clienti"></div>
  <div class="fermi" id="fermi"></div>

  <!-- ALLARMI CONFIGURAZIONE — compare solo dove esiste allarmi.json. Sta in ALTO
       perche' e' l'unica cosa che va guardata prima dei numeri: se una campagna e'
       nata male, i numeri sotto stanno misurando una cosa rotta.
       Dati da motore/collaudo_ads.py (Meta + Drive). -->
  <section id="allarmi" hidden></section>
  <style>#allarmi .grave{color:var(--crit);font-weight:700}
  #allarmi .medio{color:var(--accent);font-weight:650}
  #allarmi .lieve{color:var(--muted)}</style>
  <!-- COSTI CHE SCAPPANO — compare solo dove esiste costi.json (la dashboard di
       casa AEA). Stessa domanda delle ads, sull'altro lato: dove escono soldi
       che non dovrebbero. Dati da motore/costi_che_scappano.py (Zoho Books). -->
  <section id="costi" hidden></section>
  <style>#costi .num{text-align:right;font-variant-numeric:tabular-nums}</style>

  <footer id="foot"></footer>
</div>

<script>
const eur = n => "€" + (n ?? 0).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
const eur0 = n => "€" + Math.round(n ?? 0).toLocaleString("it-IT");
const int = n => Math.round(n ?? 0).toLocaleString("it-IT");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const LABEL = {kill:"STACCA", watch:"SORVEGLIA", winner:"VINCENTE", ok:"OK", early:"PRESTO"};
const chip = s => `<span class="chip c-${s}"><span class="dot"></span>${LABEL[s]||s}</span>`;

let DATA = null, NAMES = null;
/* ?cliente=SIGLA apre la pagina già sul singolo account: è il link
   che si manda al cliente perché veda solo il suo. */
let state = {cliente: new URLSearchParams(location.search).get("cliente") || "",
             stato:"", soloAttive:false, expand:false};

/* Nome cliente e campagna: sigla finche' non si sbloccano i nomi veri. */
/* Con anonymize:false il nome vero arriva gia' nel dato; altrimenti si
   parte dalla sigla e lo si sblocca con la passphrase. */
const gg = iso => { const p = String(iso||"").split("-"); return p.length===3 ? p[2]+"/"+p[1] : String(iso||""); };
const nomeCli = a => (NAMES && NAMES.clienti[a.alias]) || a.nome_breve || a.nome_reale || a.alias;
const nomeCamp = k => (NAMES && NAMES.campagne[k.id]) || k.name;

/* ---------- sblocco nomi veri (AES-GCM, chiave da passphrase) ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decryptNames(pass){
  const enc = await (await fetch("names.enc?" + Date.now())).json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass),
    "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(enc.salt), iterations:enc.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(enc.nonce)}, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function unlock(pass, silent){
  const btn = document.getElementById("unlock");
  try {
    NAMES = await decryptNames(pass);
    sessionStorage.setItem("adscockpit_pw", pass);
    btn.textContent = "Nascondi nomi veri";
    btn.setAttribute("aria-pressed","true");
    render();
  } catch(e){
    NAMES = null;
    sessionStorage.removeItem("adscockpit_pw");
    if (!silent) alert("Passphrase sbagliata.");
  }
}

/* ---------- caricamento ---------- */
fetch("data.json?" + Date.now())
  .then(r => r.json())
  .then(d => {
    DATA = d;
    render();
    document.getElementById("unlock").style.display = d.nomi_sbloccabili ? "" : "none";
    const saved = sessionStorage.getItem("adscockpit_pw");
    if (saved && d.nomi_sbloccabili) unlock(saved, true);
  })
  .catch(e => document.getElementById("meta").textContent = "Impossibile leggere data.json: " + e);

/* Il perimetro di TUTTA la pagina: tutti i clienti, o quello selezionato. */
let CVRMIN = 4;
const R2 = () => (DATA && DATA.regole) || {};
/* CVR click -> lead: quanti dei click che abbiamo pagato diventano un contatto vero.
   Sotto la soglia il collo e' il MODULO (o la landing), non le ads. */
const cvrCli  = c => (c.link_clicks ? c.leads / c.link_clicks * 100 : null);
const cvrCamp = k => (k.link_clicks ? k.leads / k.link_clicks * 100 : null);
/* letture sulle sole creative accese (campo "vivo" del motore) */
const vCpl  = c => (c.vivo ? c.vivo.cpl : null);
const vLead = c => (c.vivo ? c.vivo.leads : 0);
const vCvr  = c => (c.vivo ? c.vivo.cvr : null);

function scope(){
  if (!state.cliente) return DATA.clienti;
  return DATA.clienti.filter(c => c.alias === state.cliente);
}

/* I totali vengono ricalcolati sul perimetro, non letti dal file:
   così selezionando un cliente ogni numero in pagina parla solo di lui. */
function totali(sel){
  const spesa = sel.reduce((s,c)=>s+c.spend,0);
  const lead  = sel.reduce((s,c)=>s+c.leads,0);
  const spr   = sel.reduce((s,c)=>s+c.sprecato,0);
  const linkClicks = sel.reduce((s,c)=>s+(c.link_clicks||0),0);
  const g = DATA.periodo.giorni || 1;
  /* CPL e CVR si leggono sulle CREATIVE ACCESE (c.vivo), non sulla media
     di campagna: con una campagna sola sempre accesa la media include le
     creative gia' staccate e racconta un CPL che non esiste piu' (16/9/2026). */
  const vivi = sel.filter(c => c.vivo);
  const vs = vivi.reduce((s,c)=>s+c.vivo.spend,0);
  const vl = vivi.reduce((s,c)=>s+c.vivo.leads,0);
  const vc = vivi.reduce((s,c)=>s+(c.vivo.link_clicks||0),0);
  const ncr = vivi.reduce((s,c)=>s+(c.vivo.n_creative||0),0);
  return {
    spesa, lead, sprecato: spr,
    cpl: vl ? vs/vl : null,
    cpl_storico: lead ? spesa/lead : null,
    creative_accese: ncr,
    linkClicks,
    cvr: vc ? vl/vc*100 : null,
    quota: spesa ? spr/spesa*100 : 0,
    al_mese: spr/g*30,
    brucia_oggi: sel.reduce((s,c)=>s+c.brucia_oggi,0),
    da_staccare: sel.reduce((s,c)=>s+c.n_kill_ancora_accese,0),
    /* Lead mancati = quanti lead avrebbe dato TUTTO il budget girando al CPL
       target, meno quelli arrivati davvero. Non e' il budget parcheggiato sui
       perdenti (quello sta nella tabella di riallocazione): e' il divario col
       target, e per questo e' un numero grosso. */
    lead_mancati: 0,
    campagne: sel.reduce((s,c)=>s+c.n_campagne,0)
  };
}

const tile = (lab,val,note,cls="") =>
  `<div class="tile ${cls}"><div class="lab">${lab}</div>
   <div class="val mono">${val}</div><div class="note">${note||""}</div></div>`;

function render(){
  const d = DATA, R = d.regole, sel = scope(), t = totali(sel);
  CVRMIN = R.cvr_floor_pct || 4;
  const CPLT = R.cpl_target_eur || 15;
  t.lead_attesi = CPLT ? Math.floor(t.spesa / CPLT) : 0;
  t.lead_mancati = Math.max(0, t.lead_attesi - t.lead);
  const uno = sel.length === 1;

  document.title = d.titolo || "ADS Cockpit";
  document.getElementById("titolo").textContent =
    (state.cliente && uno) ? nomeCli(sel[0]) : (d.titolo || "ADS Cockpit");

  const gen = new Date(d.generato);
  document.getElementById("meta").innerHTML =
    `Periodo <b>${d.periodo.da}</b> → <b>${d.periodo.a}</b> (${d.periodo.giorni} giorni) ·
     ${sel.length} ${sel.length === 1 ? "account" : "account"} · ${int(t.campagne)} campagne ·
     aggiornato ${gen.toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"})}`;

  document.getElementById("rules").innerHTML = [
    `<b>0 lead</b> sopra ${eur0(R.spend_kill_zero_lead_eur || R.spend_warn_eur)} di spesa → si stacca`,
    `<b>1 lead</b>: si lascia girare fino a ${eur0(R.spend_kill_eur)}, il CPL non si guarda`,
    `entro ${eur0(R.spend_kill_eur)} servono <b>2 lead</b> (CPL sotto ${eur0(R.spend_kill_eur/2)}) → altrimenti si stacca`,
    `da <b>2 a ${int((R.cpl_kill_lead_minimi || 6) - 1)} lead</b> si lascia girare` + (R.cpl_allarme_pochi_lead_eur ? `, CPL sopra <b>${eur0(R.cpl_allarme_pochi_lead_eur)}</b> → si stacca (tetto di allarme)` : ``),
    `da <b>${int(R.cpl_kill_lead_minimi || 6)} lead</b>, CPL sopra <b>${eur0(R.cpl_kill_eur)}</b> e CVR sotto <b>${CVRMIN}%</b> → si stacca`,
    `CVR di almeno <b>${CVRMIN}%</b> sui click al link → il solo CPL alto non stacca`,
    `CPL sotto <b>${eur0(R.cpl_winner_eur)}</b> → vincente, ci si mette budget`,
    `<b>CVR click → lead</b> sotto <b>${CVRMIN}%</b> → il problema è il modulo, non le ads`,
    `<b>CPL target ${eur0(CPLT)}</b> → il metro dei lead mancati (${eur0(R.cpl_kill_eur)} è il limite di stacco, non l'obiettivo)`
  ].map(r => `<span class="rule">${r}</span>`).join("");

  /* clienti entrati da poco: il parco si popola da solo, ma va detto */
  const nuovi = (d.nuovi || []).map(al => {
    const c = d.clienti.find(x => x.alias === al) || (d.fermi||[]).find(x => x.alias === al);
    return c ? nomeCli(c) : al;
  });
  document.getElementById("nuovi").innerHTML = nuovi.length
    ? `<div class="nuovo"><b>Nuovo account entrato</b> · ${nuovi.map(esc).join(", ")}
        · aggiunto in automatico, nessuna configurazione richiesta</div>`
    : "";

  /* selettore account */
  const selEl = document.getElementById("fCliente");
  const cur = state.cliente;
  selEl.innerHTML = `<option value="">Tutti i clienti (${d.clienti.length})</option>` +
    d.clienti.map(c => `<option value="${esc(c.alias)}">${esc(nomeCli(c))}</option>`).join("");
  selEl.value = cur;
  document.getElementById("scopebar").style.display = d.clienti.length > 1 ? "" : "none";
  document.getElementById("scopeNote").textContent = state.cliente
    ? "tutta la pagina parla solo di questo account"
    : "seleziona un account per vedere solo il suo";

  /* tiles */

  document.getElementById("tiles").innerHTML = [
    tile("Budget sprecato", eur0(t.sprecato),
         `${t.quota.toFixed(1)}% di tutto lo speso · ${eur0(t.al_mese)} al mese a questo ritmo`, "hero"),
    tile("Da staccare ora", int(t.da_staccare),
         t.brucia_oggi > 0 ? `bruciano ${eur(t.brucia_oggi)} al giorno` : "campagne fuori regola ancora accese", "act"),
    tile("Spesa", eur0(t.spesa), `${d.periodo.giorni} giorni`),
    tile("Lead", int(t.lead), "moduli e conversioni Meta"),
    tile("CPL creative accese", t.cpl ? eur(t.cpl) : "n/d",
         t.cpl ? `${int(t.creative_accese)} creative accese · ${t.cpl > R.cpl_kill_eur ? "sopra" : "sotto"} il limite di ${eur0(R.cpl_kill_eur)}`
               + (t.cpl > R.cpl_kill_eur && t.cvr >= CVRMIN ? ` · CVR ${t.cvr.toFixed(1)}%: non stacca` : "")
               + (t.cpl_storico ? ` · media storica ${eur(t.cpl_storico)}` : "")
               : (t.cpl_storico ? `nessuna creativa accesa · media storica ${eur(t.cpl_storico)}` : "")),
    tile("CVR click → lead", t.cvr != null ? t.cvr.toFixed(1) + "%" : "n/d",
         t.cvr == null ? "" : (t.cvr < CVRMIN
            ? `sotto il ${CVRMIN}% minimo: il collo è il modulo, non le ads`
            : `sopra il ${CVRMIN}% minimo · ${int(t.linkClicks)} click al link`)),
    tile("Lead mancati", int(t.lead_mancati),
         `${eur0(t.spesa)} al CPL target di ${eur0(CPLT)} valgono ${int(t.lead_attesi)} lead, ne sono arrivati ${int(t.lead)}`,
         t.lead_mancati > 0 ? "act" : "")
  ].join("");

  renderAzioni(sel);
  renderEsiti(sel);

  /* riallocazione */
  const rr = sel.filter(c => c.riallocazione.budget_da_spostare > 0);
  document.getElementById("realloc").innerHTML = rr.length ? `
    <table><thead><tr><th>${state.cliente ? "Account" : "Cliente"}</th>
      <th>Budget finito sui perdenti</th><th>Lead mancati (prudente)</th>
      <th>CPL delle vincenti</th><th>Se reggesse lo scale</th></tr></thead><tbody>
      ${rr.sort((a,b)=>b.riallocazione.budget_da_spostare-a.riallocazione.budget_da_spostare).map(c=>`
        <tr><td><b style="color:var(--accent)">${esc(nomeCli(c))}</b></td>
          <td class="mono">${eur(c.riallocazione.budget_da_spostare)}</td>
          <td class="mono" style="color:var(--good)">${c.riallocazione.lead_prudente ? "+"+int(c.riallocazione.lead_prudente) : "—"}</td>
          <td class="mono">${c.riallocazione.cpl_vincente ? eur(c.riallocazione.cpl_vincente)
              : '<span style="color:var(--muted)">nessuna vincente</span>'}</td>
          <td class="mono" style="color:var(--muted)">${c.riallocazione.lead_ottimistico ? "+"+int(c.riallocazione.lead_ottimistico) : "—"}</td>
        </tr>`).join("")}
    </tbody></table>
    <p class="sub" style="margin-top:10px">Il numero su cui contare è quello prudente.
      La colonna a destra vale solo se le campagne vincenti tengono lo stesso CPL a budget più alto,
      cosa che quasi mai succede.</p>`
    : `<div class="empty">Niente budget parcheggiato su campagne fuori regola.</div>`;

  renderClienti();
}

/* ---------- azioni di oggi, spuntabili ----------
   Le spunte stanno nel ponte condiviso della checklist CSM (foglio Google via
   Apps Script), cosi' chi spunta da un telefono lo vede anche l'altro.
   Chiave: ckcsm:ads|<sigla>|ad|<id inserzione>:<giorno della spunta>.
   Spuntata oggi resta barrata fino a domani; dal giorno dopo non esce piu'.
   Il ponte toglie da solo le spunte oltre 21 giorni: se una creativa e' ancora
   accesa e fuori regola dopo tre settimane, torna fuori, ed e' giusto cosi'. */
const SYNC = "https://script.google.com/macros/s/AKfycbyYBeMPQ6wKtKeScl-XAK5dgqb7TOlUZTsE3u2ZyXZwMbcE7qQnV3oQly9dDEzcrDcC/exec";
const OGGI = new Date().toLocaleDateString("sv-SE", {timeZone:"Europe/Rome"});
let SPUNTE = {};
try { SPUNTE = JSON.parse(localStorage.getItem("adscockpit_spunte") || "{}"); } catch(e) {}
const salvaLocale = () => { try { localStorage.setItem("adscockpit_spunte", JSON.stringify(SPUNTE)); } catch(e) {} };

function leggiSpunte(){
  return fetch(SYNC + "?t=" + Date.now()).then(r => r.json()).then(j => {
    const nuove = {};
    Object.keys((j && j.stato) || {}).forEach(k => {
      const m = k.match(/^ckcsm:ads\|(.+):(\d{4}-\d{2}-\d{2})$/);
      if (m && (!nuove[m[1]] || m[2] > nuove[m[1]])) nuove[m[1]] = m[2];
    });
    SPUNTE = nuove; salvaLocale();
    if (DATA) renderAzioni(scope());
  }).catch(() => {});
}

function spunta(id, on){
  const set = {};
  if (on) { set["ckcsm:ads|" + id + ":" + OGGI] = 1; SPUNTE[id] = OGGI; }
  else if (SPUNTE[id]) { set["ckcsm:ads|" + id + ":" + SPUNTE[id]] = 0; delete SPUNTE[id]; }
  salvaLocale();
  renderAzioni(scope());
  fetch(SYNC, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({set})}).catch(() => {});
}

function renderAzioni(sel){
  const voci = [];
  sel.forEach(c => c.campagne.forEach(k => (k.ads || []).forEach(a => {
    if (a.status === "kill" && a.attiva) voci.push({
      id: c.alias + "|ad|" + a.id, cli:c, campagna:k, creativa:a, daily_budget:k.daily_budget || 0});
  })));
  voci.sort((a,b) => (b.daily_budget||0) - (a.daily_budget||0) || b.creativa.sprecato - a.creativa.sprecato);
  /* posizionamenti fuori regola ancora in spesa: UNA riga per account; se si
     aggiunge un posizionamento nuovo la chiave cambia e la riga torna fuori */
  sel.forEach(c => {
    const v = ((c.posizionamenti || {}).voci || []).filter(p => p.da_staccare);
    if (v.length) voci.push({id: c.alias + "|pos|" + v.map(p => p.nome).sort().join("+"), cli:c, pos:v});
  });
  const nascoste = voci.filter(x => SPUNTE[x.id] && SPUNTE[x.id] < OGGI).length;
  const vive = voci.filter(x => !(SPUNTE[x.id] && SPUNTE[x.id] < OGGI));
  const daFare = vive.filter(x => !SPUNTE[x.id]).length;
  vive.sort((a,b) => (SPUNTE[a.id] ? 1 : 0) - (SPUNTE[b.id] ? 1 : 0));
  document.getElementById("nact").textContent = daFare ? `(${daFare})` : "";
  const box = x => `<label class="tick" title="Spunta quando e' fatto: da domani non esce piu'">
      <input type="checkbox" data-az="${esc(x.id)}" ${SPUNTE[x.id] ? "checked" : ""}></label>`;
  const riga = x => x.pos ? `
    <div class="act-row${SPUNTE[x.id] ? " done" : ""}">${box(x)}
      <div class="who">${esc(nomeCli(x.cli))}</div>
      <div><div class="what">Posizionamenti da escludere: ${x.pos.map(p => esc(p.nome)).join(", ")}</div>
        <div class="why">ultimi 30 giorni · ${x.pos.map(p => `${esc(p.nome)}: ${esc(p.reason)}`).join(" · ")}</div></div>
      <div class="burn">${eur(x.pos.reduce((t,p) => t + p.spend_7g, 0))} negli ultimi 7g<br>
        <span style="color:var(--muted);font-weight:400">speso ${eur(x.pos.reduce((t,p) => t + p.spend, 0))} in 30g</span></div>
    </div>` : `
    <div class="act-row${SPUNTE[x.id] ? " done" : ""}">${box(x)}
      <div class="who">${esc(nomeCli(x.cli))}</div>
      <div><div class="what">Creativa: ${esc(x.creativa.name)}</div>
        <div class="why">Campagna: ${esc(nomeCamp(x.campagna))} · ${esc(x.creativa.reason)}${
          x.creativa.flags.length ? " · " + esc(x.creativa.flags[0]) : ""}</div></div>
      <div class="burn">${x.daily_budget ? eur(x.daily_budget)+"/giorno" : "attiva"}<br>
        <span style="color:var(--muted);font-weight:400">già sprecati ${eur(x.creativa.sprecato)}</span></div>
    </div>`;
  const host = document.getElementById("azioni");
  host.innerHTML = (vive.length ? vive.map(riga).join("")
      : `<div class="empty">Nessuna creativa fuori regola ancora accesa. Tutto pulito.</div>`)
    + (nascoste ? `<p class="sub" style="margin-top:6px">${nascoste} ${nascoste === 1 ? "azione spuntata" : "azioni spuntate"} nei giorni scorsi: non compaiono più.</p>` : "");
  host.querySelectorAll("input[data-az]").forEach(cb =>
    cb.addEventListener("change", () => spunta(cb.dataset.az, cb.checked)));
}
leggiSpunte();

/* ---------- esiti per creativa ----------
   Dai moduli lead: le caselle 1-2-3 APT e CHIUSO sommate per creativa (ad_id).
   Il CPL dice quanto costa un contatto; questa tabella dice quale creativa
   porta gente che si presenta e compra. */
function renderEsiti(sel){
  const hA = document.getElementById("esiti"), hC = document.getElementById("chiusi");
  const righe = [], per = [];
  const T = {lead:0, apt2:0, apt3:0, chiusi:0, s_apt2:0, s_apt3:0, s_chiusi:0, spesa:0};
  let letto = null;
  sel.forEach(c => {
    const e = c.esiti_creative; if (!e) return;
    letto = letto || e.letto;
    e.righe.forEach(r => righe.push({...r, cli:c}));
    const t = e.totale_creative, z = e.senza_creativa;
    T.lead += t.lead; T.apt2 += t.apt2; T.apt3 += t.apt3; T.chiusi += t.chiusi; T.spesa += t.spesa || 0;
    T.s_apt2 += z.apt2; T.s_apt3 += z.apt3; T.s_chiusi += z.chiusi;
    per.push({cli:c, apt:t.apt2 + z.apt2, apt3:t.apt3 + z.apt3, chiusi:t.chiusi + z.chiusi, lead:t.lead + z.lead});
  });
  if (!sel.some(c => c.esiti_creative)){
    const vuoto = `<div class="empty">Per questo account non c'è un modulo lead collegato.</div>`;
    hA.innerHTML = vuoto; hC.innerHTML = vuoto; return;
  }
  const multi = sel.length > 1;
  const apt = T.apt2 + T.s_apt2, cli = T.chiusi + T.s_chiusi;
  const muto = v => v ? int(v) : '<span style="color:var(--muted)">0</span>';
  const nd = '<span style="color:var(--muted)">n.d.</span>';
  const fonte = `<p class="sub" style="margin-top:10px">Dai moduli lead${letto ? ", letti il " +
    new Date(letto).toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"}) : ""}: appuntamento = casella 2 APT
    (il lead si è presentato), cliente = casella CHIUSO. Somma di tutto lo storico dei moduli: le caselle non hanno data.
    Il costo usa la spesa della creativa nel periodo del cockpit.</p>`;

  /* ---- APPUNTAMENTI ---- */
  const rA = righe.filter(r => r.apt2).sort((a,b) => b.apt2 - a.apt2 || (a.costo_apt||1e9) - (b.costo_apt||1e9));
  hA.innerHTML = `<div class="tiles">
      ${tile("Appuntamenti fatti", int(apt), "tutti, sommati dall'inizio dei moduli", "hero")}
      ${tile("Da creative ads", int(T.apt2), `${int(T.lead)} lead tracciati · ${T.lead ? Math.round(T.apt2/T.lead*100) : 0}% diventa appuntamento`)}
      ${tile("Costo medio per appuntamento", T.apt2 && T.spesa ? eur(T.spesa / T.apt2) : "n.d.", "spesa di tutte le creative con lead nei moduli ÷ appuntamenti")}
    </div>
    <div style="overflow-x:auto;margin-top:14px"><table><thead><tr>
      ${multi ? "<th>Cliente</th>" : ""}<th>Creativa che ha portato appuntamenti</th><th>Appuntamenti</th>
      <th>Lead</th><th>Lead → appuntamento</th><th>Costo per appuntamento</th></tr></thead><tbody>
      ${rA.length ? rA.map(r => `<tr>
        ${multi ? `<td><b style="color:var(--accent)">${esc(nomeCli(r.cli))}</b></td>` : ""}
        <td>${esc(r.nome)} ${r.attiva ? '<span class="chip c-ok"><span class="dot"></span>ACCESA</span>' : '<span class="chip c-early"><span class="dot"></span>SPENTA</span>'}
          <div class="sub" style="font-size:11.5px">${esc(r.campagna || "")}</div></td>
        <td class="mono"><b>${int(r.apt2)}</b></td><td class="mono">${int(r.lead)}</td>
        <td class="mono">${Math.round(r.apt2 / r.lead * 100)}%</td>
        <td class="mono">${r.costo_apt ? eur(r.costo_apt) : nd}</td></tr>`).join("")
        : `<tr><td colspan="6" class="empty">Nessuna creativa ha ancora portato un appuntamento.</td></tr>`}
    </tbody></table></div>${fonte}`;

  /* ---- CLIENTI ---- */
  const rC = righe.filter(r => r.chiusi).sort((a,b) => b.chiusi - a.chiusi || (a.costo_cliente||1e9) - (b.costo_cliente||1e9));
  hC.innerHTML = `<div class="tiles">
      ${tile("Clienti arrivati", int(cli), "casella CHIUSO, sommati dall'inizio dei moduli", cli ? "" : "act")}
      ${tile("Da creative ads", int(T.chiusi), apt ? `${Math.round(cli/apt*100)}% degli appuntamenti diventa cliente` : "")}
      ${tile("Appuntamenti di chiusura", int(T.apt3 + T.s_apt3), "casella 3 APT")}
    </div>
    <div style="overflow-x:auto;margin-top:14px"><table><thead><tr>
      ${multi ? "<th>Cliente</th>" : ""}<th>Creativa che ha portato clienti</th><th>Clienti</th>
      <th>Appuntamenti</th><th>Lead</th><th>Costo per cliente</th></tr></thead><tbody>
      ${rC.length ? rC.map(r => `<tr>
        ${multi ? `<td><b style="color:var(--accent)">${esc(nomeCli(r.cli))}</b></td>` : ""}
        <td>${esc(r.nome)} ${r.attiva ? '<span class="chip c-ok"><span class="dot"></span>ACCESA</span>' : '<span class="chip c-early"><span class="dot"></span>SPENTA</span>'}
          <div class="sub" style="font-size:11.5px">${esc(r.campagna || "")}</div></td>
        <td class="mono" style="color:var(--good)"><b>${int(r.chiusi)}</b></td>
        <td class="mono">${muto(r.apt2)}</td><td class="mono">${int(r.lead)}</td>
        <td class="mono">${r.costo_cliente ? eur(r.costo_cliente) : nd}</td></tr>`).join("")
        : `<tr><td colspan="6" class="empty">Nessuna creativa ha ancora portato un cliente chiuso.</td></tr>`}
    </tbody></table></div>`;
}

function posLine(c){
  const tutte = (c.posizionamenti || {}).voci || [];
  if (!tutte.length) return "";
  /* sotto i 5 euro in 30 giorni non dicono niente: una voce sola "altri" */
  const v = tutte.filter(p => p.spend >= 5 || p.da_staccare);
  const resto = tutte.filter(p => !v.includes(p));
  if (resto.length) v.push({nome:`altri ${resto.length}`, reason:resto.map(p => p.nome).join(", "),
    spend:resto.reduce((t,p) => t + p.spend, 0), leads:resto.reduce((t,p) => t + p.leads, 0)});
  return `<div class="pos"><span class="pl">Posizionamenti 30g:</span>${v.map(p =>
    `<span class="p ${p.da_staccare ? "kill" : ""}" title="${esc(p.reason)}">${esc(p.nome)} ${eur0(p.spend)} · ${int(p.leads)} lead${
      p.cpl ? " · " + eur0(p.cpl) : ""}${p.da_staccare ? " · stacca" : ""}</span>`).join("")}</div>`;
}

function renderClienti(){

  const maxSpr = Math.max(...sel.map(c => c.sprecato), 1);
  const host = document.getElementById("clienti");
  document.getElementById("ntitle").textContent =
    state.cliente ? "· " + nomeCli(sel[0] || {alias:state.cliente}) : (d.sottotitolo ? "· " + d.sottotitolo : "");

  host.innerHTML = sel.map(c => {
    const camp = c.campagne.filter(k =>
      (!state.stato || k.status === state.stato) && (!state.soloAttive || k.attiva));
    const open = state.expand || sel.length === 1 || c.n_kill_ancora_accese > 0;
    return `
    <div class="client ${open ? "open" : ""}">
      <div class="chead" role="button" tabindex="0">
        <div class="alias">${esc(nomeCli(c))}${c.solo_nostre_dal ? `<span style="margin-left:8px;font-size:11px;font-weight:400;color:var(--muted)">solo nostre ads, dal ${esc(gg(c.solo_nostre_dal))}</span>` : ""}</div>
        <div><div class="k">Spesa</div><div class="v mono">${eur0(c.spend)}</div></div>
        <div><div class="k">Lead</div><div class="v mono">${int(c.leads)}</div></div>
        <div><div class="k">CPL creative accese</div><div class="v mono" style="color:${
          vCpl(c) == null ? "var(--muted)" : c.n_kill_ancora_accese > 0 ? "var(--crit)"
          : vCpl(c) <= d.regole.cpl_winner_eur ? "var(--good)" : "inherit"}">${
          vCpl(c) ? eur(vCpl(c)) : "n/d"}</div>${
          c.cpl ? `<div class="k">storico ${eur(c.cpl)}</div>` : ""}</div>
        <div><div class="k">CVR creative accese</div><div class="v mono" style="color:${
          vCvr(c) == null ? "var(--muted)" : vCvr(c) < CVRMIN ? "var(--crit)" : "var(--good)"}">${
          vCvr(c) == null ? "n/d" : vCvr(c).toFixed(1) + "%"}</div></div>
        <div><div class="k">Sprecato</div><div class="v mono" style="color:var(--crit)">${eur0(c.sprecato)}</div></div>
        <div class="spark"><div class="k">${c.quota_sprecata}% sprecato · ${c.n_kill} fuori regola${
          c.n_kill_ancora_accese ? `, <b style="color:var(--crit)">${c.n_kill_ancora_accese} accese</b>` : ""}</div>
          <div class="bar"><i style="width:${Math.max(2, c.sprecato / maxSpr * 100)}%"></i></div></div>
        <div class="caret">›</div>
      </div>
      <div class="cbody">${posLine(c)}${camp.length ? `
        <table><thead><tr>
          <th>Creativa</th><th>Stato</th><th>Spesa</th><th>Lead</th><th>CPL</th>
          <th>CPL 7g</th><th>CTR</th><th>CVR</th><th>Sprecato</th></tr></thead><tbody>
          ${camp.map(k => {
            const ads = (k.ads || []).filter(a => !state.soloAttive || a.attiva);
            const v = k.vivo;
            const rigaCamp = `<tr class="camp ${k.attiva ? "" : "off"}">
            <td class="cname"><div class="n">${esc(nomeCamp(k))}${
              k.attiva ? "" : `<span class="tag-off">${esc(k.effective_status)}</span>`}</div>
              <div class="r">${esc(k.reason)}</div>
              ${k.flags.map(f => `<div class="flag${f.startsWith("DA RIPROVARE") ? " riprova" : ""}">${esc(f)}</div>`).join("")}</td>
            <td>${chip(k.status)}</td>
            <td class="mono">${eur(k.spend)}</td>
            <td class="mono">${int(k.leads)}</td>
            <td class="mono">${v && v.cpl ? eur(v.cpl) : "—"}${
              k.cpl ? `<div class="k">storico ${eur(k.cpl)}</div>` : ""}</td>
            <td class="mono">${v && v.recent_cpl ? eur(v.recent_cpl) : '<span style="color:var(--muted)">—</span>'}</td>
            <td class="mono">${v && v.ctr ? v.ctr.toFixed(2) + "%" : "—"}</td>
            <td class="mono" style="color:${
              !v || v.cvr == null ? "var(--muted)"
              : (v.link_clicks >= (R2().cvr_min_clicks || 30) && v.cvr < CVRMIN) ? "var(--crit)"
              : v.cvr >= CVRMIN ? "var(--good)" : "inherit"}">${
              !v || v.cvr == null ? "—" : v.cvr.toFixed(1) + "%"}</td>
            <td class="mono" style="color:${k.sprecato > 0 ? "var(--crit)" : "var(--muted)"}">${
              k.sprecato > 0 ? eur(k.sprecato) : "—"}</td>

            const righeAds = ads.map(a => `<tr class="ad ${a.attiva ? "" : "off"}">

              a.attiva ? "" : `<span class="tag-off">${esc(a.effective_status)}</span>`}</div>

            <td class="mono">${int(a.leads)}</td>

              : '<span style="color:var(--muted)">—</span>'}</td>
            <td class="mono">${a.ctr ? a.ctr.toFixed(2) + "%" : "—"}</td>

            return rigaCamp + righeAds;
          }).join("")}
        </tbody></table>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">
          La riga della campagna e' il contenitore: spesa e lead sono il totale storico, CPL, CPL 7g, CTR e CVR
          sono delle sole creative ancora accese. Le righe ↳ sono le singole creative.</div>`
        : `<div class="empty">Nessuna campagna con questo filtro.</div>`}
      </div>
    </div>`;
  }).join("");

  host.querySelectorAll(".chead").forEach(h => {
    const toggle = () => h.parentElement.classList.toggle("open");
    h.addEventListener("click", toggle);
    h.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
  });

  /* account collegati ma fermi: solo nella vista d'insieme */
  const fermi = (!state.cliente && DATA.fermi) ? DATA.fermi : [];
  document.getElementById("fermi").innerHTML = fermi.length
    ? `<div style="width:100%;color:var(--muted);font-size:12.5px;margin-top:14px">
         Collegati ma senza spesa nel periodo:</div>` +
      fermi.map(f => `<div class="fermo"><b>${esc(nomeCli(f))}</b> · nessuna campagna attiva</div>`).join("")
    : "";

  document.getElementById("foot").innerHTML =
    `Fonte: Meta Marketing API, letta direttamente dagli ad account.
     Budget sprecato = euro usciti oltre il punto in cui la regola diceva di staccare.
     ${DATA.errori.length ? `<br><span style="color:var(--serious)">${DATA.errori.length} account non letti in questo giro.</span>` : ""}`;
}

document.getElementById("fStato").addEventListener("change", e => {

});
document.getElementById("fAttive").addEventListener("click", e => {

});
document.getElementById("fExp").addEventListener("click", e => {
  state.expand = !state.expand;

document.getElementById("unlock").addEventListener("click", e => {
  if (NAMES){
    NAMES = null; sessionStorage.removeItem("adscockpit_pw");
    e.target.textContent = "Mostra nomi veri";
    e.target.setAttribute("aria-pressed","false");
    render(); return;
  }
  const p = prompt("Passphrase per vedere i nomi veri di clienti e campagne:");
  if (p) unlock(p, false);
});

/* ---------- COSTI CHE SCAPPANO ---------- */
const COSTI_COL = {scappato:"var(--crit)", nuovo:"var(--accent)", sparito:"var(--muted)", stabile:"var(--good)"};
const COSTI_LAB = {scappato:"sta scappando", nuovo:"nuovo", sparito:"sparito", stabile:"stabile"};
fetch("costi.json", {cache:"no-store"}).then(r => r.ok ? r.json() : null).then(d => {
  if (!d || !d.voci) return;
  const el = document.getElementById("costi");
  const righe = d.voci.slice(0,20).map(v => `<tr>
      <td>${v.voce}</td>
      <td class="num">${eur0(v.mese_corrente)}</td>
      <td class="num">${v.atteso_a_oggi == null ? "—" : eur0(v.atteso_a_oggi)}</td>
      <td class="num">${v.variazione == null ? "—" : (v.variazione > 0 ? "+" : "") + v.variazione + "%"}</td>
      <td style="color:${COSTI_COL[v.stato]};font-weight:650">${COSTI_LAB[v.stato]}</td>
    </tr>`).join("");
  el.innerHTML = `
    <h2 style="font-size:17px;margin:38px 0 6px">Costi che scappano</h2>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.55;margin:0 0 12px">
      Spese Zoho del mese in corso (${d.quota_mese}% di mese trascorso) contro la media dei due mesi
      precedenti, riportata ai giorni gia' passati.
      <b style="color:var(--ink)">${eur0(d.extra_del_mese)} di troppo</b> su ${d.n_scappati} voci fuori passo ·
      ${d.n_nuovi} nuove · ${d.n_spariti} sparite. Totale mese ${eur0(d.totale_corrente)},
      mese scorso ${eur0(d.totale_m1)}.
    </p>
    <table>
      <thead><tr><th>Voce</th><th class="num">Speso ora</th><th class="num">Atteso a oggi</th>
      <th class="num">Scarto</th><th>Stato</th></tr></thead>
      <tbody>${righe || '<tr><td colspan="5">Nessun costo sopra la soglia.</td></tr>'}</tbody>
    </table>
    <p style="font-size:12px;color:var(--muted);margin-top:10px">
      Fonte Zoho Books, spese reali. "Atteso a oggi" = media dei due mesi precedenti riportata
      ai giorni trascorsi, quindi confronta mele con mele a meta' mese. Aggiornato ${d.generato}.
    </p>`;
  el.hidden = false;
}).catch(() => {});
